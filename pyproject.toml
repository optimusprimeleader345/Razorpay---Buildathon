[project]
name = "failed-subscription-recovery-agent"
version = "0.1.0"
description = "Scaffolding for Failed Subscription Recovery Agent"
authors = [{ name = "Buildathon Team" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "anthropic>=0.18.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
